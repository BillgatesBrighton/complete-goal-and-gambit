<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <title>GOAL$GAMBIT | Password Recovery</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .recovery-card{max-width:560px;margin:48px auto;padding:24px;text-align:left;border:1px solid #3a3525;border-radius:16px;background:#111}
    .recovery-card input{width:100%;padding:13px;margin:8px 0 14px}
    .recovery-status{min-height:1.5em;color:#f4bd20}
    .recovery-help{color:#aaa;font-size:14px}
  </style>
</head>
<body>
  <header class="navbar">
    <a href="index.html" class="brand"><span class="brand-icon">♛</span><span>GOAL$GAMBIT</span></a>
  </header>
  <main>
    <section class="final-section">
      <span class="section-label">ACCOUNT SUPPORT</span>
      <h2>Password <span>recovery.</span></h2>
      <section class="recovery-card">
        <form id="requestRecoveryForm" method="post">
          <h3>Recover your password by email</h3>
          <p class="recovery-help">Enter the username and phone number saved on your account. A reset link can be sent only to an email address already verified on that account.</p>
          <label for="recoveryUsername">Username</label>
          <input id="recoveryUsername" name="username" type="text" minlength="3" maxlength="30" autocomplete="username" required>
          <label for="recoveryPhone">Phone number saved on your account</label>
          <input id="recoveryPhone" name="phone" type="tel" maxlength="20" autocomplete="tel" placeholder="e.g. 07… or +254…" required>
          <button id="requestRecoveryButton" type="submit" class="primary-button" style="border:0;cursor:pointer;width:100%;">Send reset link</button>
        </form>
        <p id="recoveryRequestMessage" class="recovery-status" role="status" aria-live="polite"></p>
        <p id="recoveryStatus" class="recovery-status" role="status" aria-live="polite" hidden></p>
        <p id="recoveryHelp" class="recovery-help" hidden></p>
        <button id="checkRecoveryStatus" type="button" class="primary-button" hidden>Check request status</button>
        <form id="setNewPassword" hidden>
          <label for="newPassword">New password</label>
          <input id="newPassword" type="password" minlength="8" maxlength="128" autocomplete="new-password" required>
          <label for="confirmNewPassword">Confirm new password</label>
          <input id="confirmNewPassword" type="password" minlength="8" maxlength="128" autocomplete="new-password" required>
          <button id="saveNewPassword" type="submit" class="primary-button" style="border:0;cursor:pointer;width:100%;">Set new password</button>
        </form>
        <p><a href="login.html" class="text-link">Return to sign in</a></p>
      </section>
    </section>
  </main>
  <script src="../js/api.js?v=20261030-email-recovery"></script>
  <script>
    (function(){
      "use strict";
      var statusNode=document.getElementById("recoveryStatus");
      var helpNode=document.getElementById("recoveryHelp");
      var requestForm=document.getElementById("requestRecoveryForm");
      var requestMessage=document.getElementById("recoveryRequestMessage");
      var requestButton=document.getElementById("requestRecoveryButton");
      var checkButton=document.getElementById("checkRecoveryStatus");
      var form=document.getElementById("setNewPassword");
      var fragment=new URLSearchParams(location.hash.slice(1));
      var ticketId=fragment.get("ticket")||"";
      var secret=fragment.get("secret")||"";
      var statusBusy=false;

      if(window.GG){
        requestForm.action=GG.API_BASE.replace(/\/+$/,"")+"/api/auth/password-recovery/request";
      }else{
        requestButton.disabled=true;
        requestMessage.textContent="Password recovery is unavailable. Please try again later.";
      }

      async function refreshStatus(){
        if(statusBusy)return;
        if(!ticketId||!secret){statusNode.textContent="This recovery link is incomplete or invalid.";helpNode.textContent="Return to sign in and request a reset link at your verified email address.";return;}
        statusBusy=true;checkButton.disabled=true;statusNode.textContent="Checking your request…";
        var result=await GG.api("/api/auth/password-recovery/status",{method:"POST",body:{ticketId:ticketId,secret:secret},noRedirect:true});
        statusBusy=false;checkButton.disabled=false;
        if(!result.ok){statusNode.textContent=result.data.message||"Could not check this recovery request.";helpNode.textContent="Keep this link private and try again later.";checkButton.hidden=false;return;}
        checkButton.hidden=false;
        switch(result.data.status){
          case "pending":
            statusNode.textContent="If your account details matched, the request is waiting for identity review.";
            helpNode.textContent="This older recovery request is waiting for support review. New requests send reset links only to an account's verified email.";
            form.hidden=true;
            break;
          case "approved":
            statusNode.textContent="Your reset link is valid.";
            helpNode.textContent="Set a new password now. This approval expires shortly.";
            checkButton.hidden=true;form.hidden=false;
            break;
          case "denied":
            statusNode.textContent="Support could not approve this request.";
            helpNode.textContent="Contact GOAL$GAMBIT support if you still need help.";
            checkButton.hidden=true;form.hidden=true;
            break;
          case "completed":
            statusNode.textContent="Your password has been changed.";
            helpNode.textContent="Sign in using your new password.";
            checkButton.hidden=true;form.hidden=true;
            history.replaceState(null,"",location.pathname+location.search);
            break;
          default:
            statusNode.textContent="This recovery request has expired.";
            helpNode.textContent="Return to sign in and request a new reset link at your verified email address.";
            checkButton.hidden=true;form.hidden=true;
        }
      }

      requestForm.addEventListener("submit",async function(event){
        event.preventDefault();
        requestButton.disabled=true;
        requestMessage.hidden=false;
        requestMessage.textContent="Checking your account details…";
        statusNode.hidden=true;helpNode.hidden=true;
        var result=await GG.api("/api/auth/password-recovery/request",{
          method:"POST",
          body:{username:document.getElementById("recoveryUsername").value.trim(),phone:document.getElementById("recoveryPhone").value.trim()},
          noRedirect:true
        });
        requestButton.disabled=false;
        statusNode.hidden=false;helpNode.hidden=false;requestMessage.hidden=true;
        if(!result.ok){
          statusNode.textContent=result.data.message||"Password recovery is temporarily unavailable.";
          helpNode.textContent="If you cannot access the verified email on your account, contact GOAL$GAMBIT support for an identity check.";
          return;
        }
        statusNode.textContent=result.data.message||"If the details match an active account with a verified email, a reset link may arrive at that address.";
        helpNode.textContent="If you have not verified an email yet, sign in and add one in Account settings. If you cannot sign in or access your email, contact GOAL$GAMBIT support.";
      });

      checkButton.addEventListener("click",refreshStatus);
      form.addEventListener("submit",async function(event){
        event.preventDefault();
        var password=document.getElementById("newPassword").value;
        var confirmPassword=document.getElementById("confirmNewPassword").value;
        var submit=document.getElementById("saveNewPassword");
        if(password!==confirmPassword){statusNode.textContent="The passwords do not match.";return;}
        submit.disabled=true;statusNode.textContent="Changing your password…";
        var result=await GG.api("/api/auth/password-recovery/complete",{method:"POST",body:{ticketId:ticketId,secret:secret,newPassword:password},noRedirect:true});
        submit.disabled=false;
        if(!result.ok){statusNode.textContent=result.data.message||"Could not change your password.";return;}
        document.getElementById("newPassword").value="";
        document.getElementById("confirmNewPassword").value="";
        statusNode.textContent=result.data.message||"Password changed. You are now signed in.";
        helpNode.textContent="Opening your dashboard…";
        checkButton.hidden=true;form.hidden=true;
        history.replaceState(null,"",location.pathname+location.search);
        GG.saveSession(result.data.token,result.data.user,result.data.user.game);
        location.replace("dashboard.html");
      });

      if(ticketId&&secret){
        requestForm.hidden=true;
        requestMessage.hidden=true;
        statusNode.hidden=false;
        helpNode.hidden=false;
        refreshStatus();
      }
    })();
  </script>
</body>
</html>
