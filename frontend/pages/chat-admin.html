<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090909"><title>GOAL$GAMBIT | Support Chat</title>
<style>
:root{color-scheme:dark;--gold:#f4bd20;--line:#2b2b2b}*{box-sizing:border-box}body{margin:0;background:#080808;color:#f8f8f8;font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}button,input,textarea{font:inherit}.wrap{max-width:1000px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.top h1{font-size:clamp(20px,3vw,27px)}a{color:var(--gold);text-decoration:none;white-space:nowrap}.panel{margin-top:12px;background:#111;border:1px solid var(--line);border-radius:18px;padding:16px}.notice{color:#aaa;margin:0 0 14px}.report{background:#0b0b0b;border:1px solid #292929;border-radius:14px;padding:14px;margin-bottom:14px}.report-grid{display:grid;gap:8px;margin-top:10px}.report input,.report textarea,.composer textarea{background:#090909;color:#fff;border:1px solid #393939;border-radius:11px;padding:11px;outline:none}.report textarea{resize:vertical;min-height:84px}.report input:focus,.report textarea:focus,.composer textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px #f4bd2020}.report button,.composer button{background:var(--gold);border:0;border-radius:11px;padding:11px 16px;font-weight:850;cursor:pointer}.report button:disabled,.composer button:disabled{opacity:.5;cursor:not-allowed}.messages{height:min(52dvh,560px);min-height:280px;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:12px 2px}.bubble{max-width:min(78%,650px);padding:11px 14px;border-radius:16px 16px 16px 5px;background:#202020;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.mine{align-self:flex-end;background:var(--gold);color:#15120a;border-radius:16px 16px 5px 16px}.meta{font-size:10px;opacity:.68;margin-top:5px}.empty{margin:auto;color:#999;text-align:center;padding:20px}.composer{border-top:1px solid #292929;padding-top:12px}.composer-row{display:flex;align-items:flex-end;gap:9px}.composer textarea{flex:1;min-width:0;resize:none;min-height:46px;max-height:150px;line-height:1.4}.composer button{height:46px;min-width:82px}.foot{display:flex;justify-content:space-between;gap:10px;color:#888;font-size:11px;margin:6px 2px 0}.status.error{color:#ff7272}.status.success{color:#83d99d}.complaint-status{min-height:18px;color:#aaa;font-size:12px}.complaint-status.error{color:#ff7272}.complaint-status.success{color:#83d99d}@media(max-width:600px){.wrap{padding:10px}.panel{padding:11px}.messages{height:52dvh}.bubble{max-width:90%}.composer-row button{min-width:70px}.foot{font-size:10px}}
</style></head><body><main class="wrap"><header class="top"><h1>🛟 Support Chat</h1><a href="chat.html">← Chat Center</a></header><section class="panel"><p class="notice">Send a private message to the GOAL$GAMBIT support team. For a player report, use the form below.</p>
<form id="reportForm" class="report"><strong>Report a problem</strong><div class="report-grid"><label>Category<select id="category" required><option value="other">Other platform issue</option><option value="match-dispute">Match dispute</option><option value="wrong-result">Incorrect result or winner</option><option value="room-code">Room-code issue</option><option value="player-behaviour">Player behaviour</option><option value="payments">Payment or wallet</option><option value="account">Account access</option><option value="player-support">Other player support</option></select></label><input id="reported" maxlength="40" placeholder="Other player username (optional)"><input id="matchId" type="number" min="1" step="1" placeholder="Match ID (optional; verify your participation)"><input id="subject" maxlength="160" placeholder="Complaint subject" required><textarea id="description" maxlength="4000" placeholder="Describe what happened. Include the score if relevant." required></textarea><label>Attach evidence (optional) · JPEG, PNG or WebP, up to 8 MB<input id="evidence" type="file" accept="image/jpeg,image/png,image/webp"></label><button id="report" type="submit">Submit complaint</button><div id="reportStatus" class="complaint-status" role="status" aria-live="polite"></div></div></form>
<section class="report"><strong>Your complaints</strong><div id="myComplaints" class="report-grid"><div class="complaint-status">Loading your cases…</div></div></section>
<div id="messages" class="messages" aria-live="polite"><div class="empty">Loading support messages…</div></div>
<form id="composer" class="composer"><div class="composer-row"><textarea id="message" maxlength="2000" rows="1" placeholder="Message support…" aria-label="Write a support message"></textarea><button id="send" type="submit">Send</button></div><div class="foot"><span id="status" class="status" role="status" aria-live="polite">Enter to send · Shift+Enter for a new line</span><span id="count">0 / 2000</span></div></form>
</section></main><script src="../js/api.js"></script><script>
(function(){
"use strict";if(!GG.requireLogin())return;
var lastSig="",sending=false,loading=false,forceBottom=true;var $=function(id){return document.getElementById(id)},esc=GG.escapeHTML;
function setStatus(text,error){$("status").textContent=text;$("status").classList.toggle("error",!!error)}
function bottom(el){return el.scrollHeight-el.scrollTop-el.clientHeight<90}
function draw(list) {
    var sig=list.map(function(m){return m.id+":"+m.message+":"+(m.read_at||"");}).join("|");
    if(sig===lastSig)return;
    var pane=$("messages"),stick=forceBottom||bottom(pane);
    forceBottom=false;lastSig=sig;
    var me=localStorage.getItem("goalGambitUserId");
    pane.innerHTML=list.length?list.map(function(m){
        var mine=String(m.sender_id)===String(me),d=new Date(m.created_at);
        var receipt=mine?(m.read_at?" · Seen by admin":" · Sent"):"";
        return '<article class="bubble '+(mine?"mine":"")+'">'+esc(m.message)+'<div class="meta">'+(mine?"You":esc(m.username||"Support"))+' · '+(isNaN(d.getTime())?"":d.toLocaleString())+esc(receipt)+'</div></article>';
    }).join(""):'<div class="empty">No support messages yet. Send your first message.</div>';
    if(stick)pane.scrollTop=pane.scrollHeight;
}
async function load(){if(loading||document.hidden)return;loading=true;try{var r=await GG.api("/api/chat/support");if(!r.ok){if(!lastSig)$("messages").innerHTML='<div class="empty">'+esc(r.data.message||"Could not load support chat.")+'</div>';return}draw(r.data.messages||[])}finally{loading=false}}
function resize(){var i=$("message");i.style.height="auto";i.style.height=Math.min(i.scrollHeight,150)+"px";$("count").textContent=i.value.length+" / 2000";$("send").disabled=!i.value.trim()||sending}
async function send(){var input=$("message"),v=input.value.trim();if(!v||sending)return;sending=true;resize();setStatus("Sending…",false);var r=await GG.api("/api/chat/support",{method:"POST",body:{message:v}});if(!r.ok){sending=false;resize();setStatus(r.data.message||"Message not sent. Your text is still here; try again.",true);return}input.value="";sending=false;forceBottom=true;resize();setStatus("Sent",false);await load();input.focus()}
$("composer").addEventListener("submit",function(e){e.preventDefault();send()});$("message").addEventListener("input",resize);$("message").addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}});
function complaintStatus(text){return String(text||"open").replace(/_/g," ").replace(/^./,function(c){return c.toUpperCase()})}
async function loadComplaints(){var host=$("myComplaints"),r=await GG.api("/api/chat/complaints");if(!r.ok){host.innerHTML='<div class="complaint-status">'+esc(r.data.message||"Could not load your complaints.")+'</div>';return}var list=r.data.complaints||[];host.innerHTML=list.length?list.map(function(c){var closed=["resolved","dismissed"].includes(c.status);return '<article class="report"><strong>'+esc(c.complaint_ref||("Case #"+c.id))+' · '+esc(complaintStatus(c.status))+'</strong><div class="meta">'+esc(c.subject||"Complaint")+' · '+esc(c.category||"other")+(c.match_id?' · Match #'+esc(c.match_id):"")+' · '+esc(new Date(c.created_at).toLocaleString())+'</div><p>'+esc(c.resolution_reason||(c.status==="awaiting_evidence"?"The admin team is waiting for evidence.":c.status==="awaiting_player"?"The admin team is waiting for your response.":""))+'</p>'+(closed?"":'<form class="report-grid" data-followup="'+Number(c.id)+'"><label>Add follow-up evidence<input type="file" name="evidence" accept="image/jpeg,image/png,image/webp" required></label><button type="submit">Add evidence</button><div class="complaint-status" role="status"></div></form>')+'</article>';}).join(""):'<div class="complaint-status">No complaints submitted yet.</div>'}
$("reportForm").addEventListener("submit",async function(e){e.preventDefault();var button=$("report"),out=$("reportStatus"),subject=$("subject").value.trim(),description=$("description").value.trim();if(!subject||!description)return;button.disabled=true;out.className="complaint-status";out.textContent="Submitting securely…";var form=new FormData();form.append("reportedUsername",$("reported").value.trim());form.append("matchId",$("matchId").value.trim());form.append("category",$("category").value);form.append("subject",subject);form.append("description",description);var file=$("evidence").files&&$("evidence").files[0];if(file)form.append("evidence",file,file.name);var r=await GG.api("/api/chat/complaint",{method:"POST",body:form});button.disabled=false;out.textContent=r.ok?"Complaint submitted. Reference: "+(r.data.complaint.complaint_ref||r.data.complaint.id):(r.data.message||"Could not submit complaint.");out.classList.add(r.ok?"success":"error");if(r.ok){$("reportForm").reset();await loadComplaints()}});
$("myComplaints").addEventListener("submit",async function(e){var form=e.target.closest("[data-followup]");if(!form)return;e.preventDefault();var file=form.elements.evidence.files&&form.elements.evidence.files[0],out=form.querySelector(".complaint-status");if(!file)return;out.textContent="Uploading securely…";var body=new FormData();body.append("evidence",file,file.name);var r=await GG.api("/api/chat/complaints/"+encodeURIComponent(form.dataset.followup)+"/evidence",{method:"POST",body:body});out.textContent=r.ok?"Evidence added to your case.":(r.data.message||"Could not add evidence.");out.classList.toggle("error",!r.ok);if(r.ok)await loadComplaints()});
window.addEventListener("focus",load);load();loadComplaints();window.setInterval(load,3000);window.setInterval(loadComplaints,30000);resize();
})();
</script></body></html>
