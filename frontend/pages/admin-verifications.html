<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>GOAL$GAMBIT | Admin Result Reviews</title>
  <style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080808;color:#f8f8f8;font:16px system-ui,"Segoe UI",sans-serif}#access{max-width:520px;margin:20px;padding:24px;border:1px solid #2d2d2d;border-radius:14px;background:#111;text-align:center;color:#bbb}</style>
</head>
<body>
  <main id="access" role="status" aria-live="polite">Checking administrator access…</main>
  <script src="../js/api.js?v=20261024-companion-latest-122"></script>
  <script>
    (function () {
      "use strict";
      var access = document.getElementById("access");
      if (!GG.requireLogin()) return;
      (async function () {
        try {
          var me = await GG.api("/api/me");
          if (!me.ok || !me.data.user) {
            access.textContent = "Please sign in to continue.";
            return;
          }
          if (me.data.user.role !== "admin") {
            location.replace("chat.html");
            return;
          }
          var response = await fetch(GG.API_BASE + "/api/admin/result-review-page", {
            headers: { Authorization: "Bearer " + GG.getToken() },
            cache: "no-store"
          });
          if (response.status === 401 || response.status === 403) {
            location.replace("chat.html");
            return;
          }
          if (!response.ok) throw new Error("Could not load administrator result reviews.");
          document.open();
          document.write(await response.text());
          document.close();
        } catch (error) {
          access.textContent = error.message || "Could not verify administrator access.";
        }
      })();
    })();
  </script>
</body>
</html>
