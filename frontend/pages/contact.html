<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GOAL$GAMBIT | Contact</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">

    <a href="index.html" class="brand">
        <span class="brand-icon">♛</span>
        <span>GOAL$GAMBIT</span>
    </a>

    <nav class="desktop-nav">
        <a href="index.html">Home</a>
        <a href="how-it-works.html">How It Works</a>
        <a href="leaderboard.html">Leaderboard</a>
    </nav>

</header>


<main>

<section class="final-section">

    <span class="section-label">
        SUPPORT
    </span>

    <h2>
        Contact
        <span>GOAL$GAMBIT.</span>
    </h2>

    <p>
        Have a question or need help? Send us a message.
    </p>


    <form
        action="#"
        method="post"
        style="max-width:600px;margin:40px auto;text-align:left;"
    >

        <label for="name">
            Name
        </label>

        <input
            type="text"
            id="name"
            name="name"
            required
            placeholder="Your name"
            style="width:100%;padding:15px;margin:8px 0 20px;"
        >


        <label for="email">
            Email
        </label>

        <input
            type="email"
            id="email"
            name="email"
            required
            placeholder="Your email"
            style="width:100%;padding:15px;margin:8px 0 20px;"
        >


        <label for="message">
            Message
        </label>

        <textarea
            id="message"
            name="message"
            rows="6"
            required
            placeholder="How can we help?"
            style="width:100%;padding:15px;margin:8px 0 20px;resize:vertical;"
        ></textarea>


        <button
            type="submit"
            class="primary-button large"
            style="border:0;cursor:pointer;width:100%;"
        >
            Send Message
            <b>→</b>
        </button>

    </form>

</section>

</main>


<footer>

    <div class="footer-column">

        <h4>Support</h4>

        <a href="contact.html">Contact</a>
        <a href="terms.html">Terms</a>
        <a href="privacy.html">Privacy</a>

    </div>

</footer>

<script src="../js/api.js"></script>
</body>
</html>
