<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GOAL$GAMBIT - Blitz Ranked</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #0d0d0d;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            padding: 20px;
        }

        .container {
            width: min(700px, 100%);
            margin: 0 auto;
        }

        /* =========================
           TOP BAR
           ========================= */

        .top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
        }

        .logo {
            color: #ffffff;
            text-decoration: none;
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 0.5px;
        }

        .logo span {
            color: #d4af37;
        }

        .back {
            color: #aaaaaa;
            text-decoration: none;
            font-size: 14px;
        }

        .back:hover {
            color: #ffffff;
        }


        /* =========================
           MAIN CARD
           ========================= */

        .card {
            background: #181818;
            border: 1px solid #303030;
            border-radius: 12px;
            padding: 24px;
        }

        h1 {
            font-size: 26px;
            margin-bottom: 8px;
        }

        .description {
            color: #888888;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 28px;
        }


        /* =========================
           SECTIONS
           ========================= */

        .section {
            margin-bottom: 25px;
        }

        .section-title {
            color: #d4af37;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }


        /* =========================
           OPTIONS
           ========================= */

        .options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .option {
            width: 100%;
            padding: 16px 10px;

            background: #222222;
            border: 1px solid #383838;
            border-radius: 8px;

            color: #ffffff;

            cursor: pointer;
            text-align: center;

            transition:
                background 0.15s ease,
                border-color 0.15s ease,
                transform 0.15s ease;
        }

        .option:hover {
            background: #2b2b2b;
            transform: translateY(-1px);
        }

        .option.selected {
            background: #30280f;
            border-color: #d4af37;
            color: #d4af37;
        }

        .option strong {
            display: block;
            font-size: 16px;
        }

        .option small {
            display: block;
            margin-top: 5px;
            color: #888888;
            font-size: 11px;
        }

        .option.selected small {
            color: #b9a45c;
        }


        /* =========================
           SUMMARY
           ========================= */

        .summary {
            margin-top: 25px;
            padding: 16px;

            background: #111111;

            border: 1px solid #292929;
            border-radius: 8px;
        }

        .summary-row {
            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 9px 0;

            border-bottom: 1px solid #252525;

            font-size: 14px;
        }

        .summary-row:last-child {
            border-bottom: none;
        }

        .summary-row span {
            color: #888888;
        }

        .summary-row strong {
            color: #ffffff;
        }


        /* =========================
           FIND MATCH BUTTON
           ========================= */

        .find-button {
            width: 100%;

            margin-top: 20px;
            padding: 15px;

            border: none;
            border-radius: 8px;

            background: #d4af37;
            color: #111111;

            font-size: 16px;
            font-weight: 900;

            cursor: pointer;

            transition:
                background 0.15s ease,
                transform 0.15s ease;
        }

        .find-button:hover {
            background: #e5c45a;
            transform: translateY(-1px);
        }

        .find-button:active {
            transform: translateY(0);
        }


        /* =========================
           NOTE
           ========================= */

        .note {
            margin-top: 15px;

            color: #666666;

            font-size: 12px;
            line-height: 1.5;

            text-align: center;
        }


        /* =========================
           MOBILE
           ========================= */

        @media (max-width: 500px) {

            body {
                padding: 12px;
            }

            .top {
                margin-bottom: 20px;
            }

            .card {
                padding: 18px;
                border-radius: 10px;
            }

            h1 {
                font-size: 22px;
            }

            .options {
                grid-template-columns: 1fr 1fr;
            }

            .option {
                padding: 15px 8px;
            }

            .logo {
                font-size: 18px;
            }

            .back {
                font-size: 13px;
            }
        }
    </style>
<script src="../js/api.js"></script>
</head>


<body>

<div class="container">


    <!-- =========================
         HEADER
         ========================= -->

    <div class="top">

        <a href="chess.html" class="logo">
            GOAL<span>$</span>GAMBIT
        </a>

        <a href="chess.html" class="back">
            ← Back
        </a>

    </div>


    <!-- =========================
         BLITZ CARD
         ========================= -->

    <div class="card">

        <h1>Blitz Ranked</h1>

        <p class="description">
            Choose your Blitz time control and stake before entering ranked matchmaking.
        </p>


        <!-- =========================
             TIME CONTROL
             ========================= -->

        <div class="section">

            <div class="section-title">
                TIME CONTROL
            </div>

            <div class="options">


                <!-- 3 + 0 -->

                <button
                    class="option selected"
                    type="button"
                    data-minutes="3"
                    data-increment="0">

                    <strong>3:00</strong>

                    <small>
                        3 minutes
                    </small>

                </button>


                <!-- 3 + 2 -->

                <button
                    class="option"
                    type="button"
                    data-minutes="3"
                    data-increment="2">

                    <strong>3 + 2</strong>

                    <small>
                        3 min + 2 sec
                    </small>

                </button>


                <!-- 5 + 0 -->

                <button
                    class="option"
                    type="button"
                    data-minutes="5"
                    data-increment="0">

                    <strong>5:00</strong>

                    <small>
                        5 minutes
                    </small>

                </button>


            </div>

        </div>


        <!-- =========================
             STAKE
             ========================= -->

        <div class="section">

            <div class="section-title">
                STAKE
            </div>

            <div class="options">


                <!-- KSh 20 -->

                <button
                    class="option selected"
                    type="button"
                    data-stake="20">

                    <strong>
                        KSh 20
                    </strong>

                    <small>
                        Entry stake
                    </small>

                </button>


                <!-- KSh 50 -->

                <button
                    class="option"
                    type="button"
                    data-stake="50">

                    <strong>
                        KSh 50
                    </strong>

                    <small>
                        Entry stake
                    </small>

                </button>


                <!-- KSh 100 -->

                <button
                    class="option"
                    type="button"
                    data-stake="100">

                    <strong>
                        KSh 100
                    </strong>

                    <small>
                        Entry stake
                    </small>

                </button>


            </div>

        </div>


        <!-- =========================
             GAME SUMMARY
             ========================= -->

        <div class="summary">

            <div class="summary-row">

                <span>
                    Game
                </span>

                <strong>
                    Blitz Ranked
                </strong>

            </div>


            <div class="summary-row">

                <span>
                    Time
                </span>

                <strong id="summaryTime">
                    3:00
                </strong>

            </div>


            <div class="summary-row">

                <span>
                    Stake
                </span>

                <strong id="summaryStake">
                    KSh 20
                </strong>

            </div>

        </div>


        <!-- =========================
             FIND MATCH
             ========================= -->

        <button
            id="findMatchButton"
            class="find-button"
            type="button">

            Find Ranked Match

        </button>


        <p class="note">
            You will be matched with another player using the same game settings.
        </p>

    </div>

</div>


<script>

    /* =====================================
       SELECTED GAME SETTINGS
       ===================================== */

    let selectedMinutes = 3;

    let selectedIncrement = 0;

    let selectedStake = 20;


    /* =====================================
       FIND THE OPTION GROUPS
       ===================================== */

    const sections =
        document.querySelectorAll(".section");


    const timeOptions =
        sections[0].querySelectorAll(".option");


    const stakeOptions =
        sections[1].querySelectorAll(".option");


    /* =====================================
       TIME CONTROL SELECTION
       ===================================== */

    timeOptions.forEach(function(button) {

        button.addEventListener(
            "click",
            function() {

                timeOptions.forEach(
                    function(item) {

                        item.classList.remove(
                            "selected"
                        );

                    }
                );


                button.classList.add(
                    "selected"
                );


                selectedMinutes =
                    Number(
                        button.dataset.minutes
                    );


                selectedIncrement =
                    Number(
                        button.dataset.increment
                    );


                updateSummary();

            }
        );

    });


    /* =====================================
       STAKE SELECTION
       ===================================== */

    stakeOptions.forEach(function(button) {

        button.addEventListener(
            "click",
            function() {

                stakeOptions.forEach(
                    function(item) {

                        item.classList.remove(
                            "selected"
                        );

                    }
                );


                button.classList.add(
                    "selected"
                );


                selectedStake =
                    Number(
                        button.dataset.stake
                    );


                updateSummary();

            }
        );

    });


    /* =====================================
       UPDATE SUMMARY
       ===================================== */

    function updateSummary() {

        let timeText;


        if (selectedIncrement === 0) {

            timeText =
                selectedMinutes + ":00";

        } else {

            timeText =
                selectedMinutes +
                " + " +
                selectedIncrement;

        }


        document.getElementById(
            "summaryTime"
        ).textContent = timeText;


        document.getElementById(
            "summaryStake"
        ).textContent =
            "KSh " + selectedStake;

    }


    /* =====================================
       FIND RANKED MATCH
       ===================================== */

    document.getElementById(
        "findMatchButton"
    ).addEventListener(
        "click",
        function() {

            const url =
                "board.html" +
                "?mode=blitz-ranked" +
                "&minutes=" +
                encodeURIComponent(
                    selectedMinutes
                ) +
                "&increment=" +
                encodeURIComponent(
                    selectedIncrement
                ) +
                "&stake=" +
                encodeURIComponent(
                    selectedStake
                );


            GG.guardedGo(url, selectedStake, "chess");

        }
    );

</script>

</body>
</html>
