<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>GOAL$GAMBIT | Administrator Access</title>
  <style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#090a0b;color:#f7f7f7;font:16px system-ui,"Segoe UI",sans-serif}main{max-width:520px;margin:20px;padding:24px;border:1px solid #2b3033;border-radius:16px;background:#121416;text-align:center;color:#c6c9cb}</style>
</head>
<body>
  <main id="access" role="status" aria-live="polite">Checking administrator access…</main>
  <script src="../js/api.js?v=admin-allowlist"></script>
  <script>
    (function () {
      "use strict";
      var access = document.getElementById("access");
      if (!GG.requireLogin()) return;
      (async function () {
        try {
          var me = await GG.api("/api/me", { noRedirect: true });
          if (!me.ok || !me.data.user) {
            access.textContent = me.data.message || "Please sign in before opening this page.";
            return;
          }
          if (me.data.user.role !== "admin") {
            access.textContent = "Administrator access is required for Daraja diagnostics.";
            return;
          }
          var response = await fetch(GG.API_BASE + "/api/admin/daraja-check-page", {
            headers: { Authorization: "Bearer " + GG.getToken() },
            cache: "no-store"
          });
          if (!response.ok) {
            access.textContent = response.status === 403
              ? "The server did not authorize this account for administrator access."
              : "Could not load administrator diagnostics (HTTP " + response.status + ").";
            return;
          }
          document.open();
          document.write(await response.text());
          document.close();
        } catch (error) {
          access.textContent = error.message || "Could not verify administrator access. Check the server connection and try again.";
        }
      })();
    })();
  </script>
</body>
</html>
