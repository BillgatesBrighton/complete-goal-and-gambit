<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#090a0b">
  <title>GOAL$GAMBIT | Admin Access</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#090a0b;color:#f7f7f7;font:16px system-ui,"Segoe UI",sans-serif}
    #access{max-width:520px;margin:20px;padding:24px;border:1px solid #2b3033;border-radius:16px;background:#121416;text-align:center;color:#c6c9cb}
    #loginFallback{display:inline-block;margin-top:14px;padding:10px 16px;border:1px solid #8b7124;border-radius:9px;color:#f4bd20;text-decoration:none;font-weight:700}
  </style>
</head>
<body>
  <main id="access" role="status" aria-live="polite">
    <div id="accessMessage">Checking administrator access…</div>
    <a id="loginFallback" href="login.html" hidden>Sign in again</a>
  </main>
  <script src="../js/api.js?v=20261019-companion-onboarding"></script>
  <script>
    (function () {
      "use strict";
      var accessMessage = document.getElementById("accessMessage");
      var loginFallback = document.getElementById("loginFallback");
      function showAccessMessage(message, needsLogin) {
        accessMessage.textContent = message;
        loginFallback.hidden = !needsLogin;
      }
      if (!GG.requireLogin()) return;
      (async function () {
        try {
          var me = await GG.api("/api/me", { noRedirect: true });
          if (!me.ok || !me.data.user) {
            showAccessMessage(me.data.message || "Your sign-in session could not be verified. Please sign in again.", true);
            return;
          }
          if (me.data.user.role !== "admin") {
            showAccessMessage("Administrator access is required for this page. Sign in with an administrator account.", false);
            return;
          }
          var response = await fetch(GG.API_BASE + "/api/admin/dashboard-page", {
            headers: { Authorization: "Bearer " + GG.getToken() },
            cache: "no-store"
          });
          if (response.status === 401) {
            showAccessMessage("Your sign-in session expired before the Admin Desk opened. Sign in again, then reopen Password recovery.", true);
            return;
          }
          if (response.status === 403) {
            var denial = {};
            try { denial = await response.json(); } catch (_) {}
            showAccessMessage(denial.message || "The server did not authorize this account for the Admin Desk. Confirm that this account is active and has the administrator role.", false);
            return;
          }
          if (!response.ok) throw new Error("Could not load the administrator dashboard (HTTP " + response.status + ").");
          var html = await response.text();
          document.open();
          document.write(html);
          document.close();
        } catch (error) {
          showAccessMessage(error.message || "Could not verify administrator access. Check the server connection and try again.", false);
        }
      })();
    })();
  </script>
</body>
</html>
