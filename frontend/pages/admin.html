<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>GOAL$GAMBIT | Admin Dashboard</title><style>body{margin:0;background:#050505;color:#fff;font-family:Arial}.wrap{max-width:1200px;margin:auto;padding:25px 18px 80px}.top{display:flex;justify-content:space-between;align-items:center}.top a{color:#f4bd20;text-decoration:none}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}.stat,.panel{background:#0d0d0d;border:1px solid #252525;border-radius:15px;padding:18px}.stat strong{display:block;color:#f4bd20;font-size:28px;margin-top:8px}.panel{margin-top:18px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-bottom:1px solid #222;padding:14px 0}.row:last-child{border-bottom:0}.row .grow{flex:1}.btn{border:1px solid #444;background:#161616;color:#fff;padding:8px 11px;border-radius:8px;cursor:pointer}.btn.gold{background:#f4bd20;color:#111;border:0}.btn.red{border-color:#7a3030;color:#ff8585}.complaint{border-bottom:1px solid #222;padding:14px 0}.chat-grid{display:grid;grid-template-columns:280px 1fr;gap:14px}.threads button{display:block;width:100%;text-align:left;margin-bottom:7px}.messages{height:380px;overflow:auto;background:#080808;padding:12px;border-radius:10px}.bubble{padding:9px 12px;background:#181818;border-radius:12px;margin:7px 0;max-width:75%}.mine{margin-left:auto;background:#f4bd20;color:#111}.send{display:flex;gap:8px;margin-top:8px}.send input{flex:1;background:#111;border:1px solid #333;color:#fff;padding:11px;border-radius:8px}.send button{background:#f4bd20;border:0;border-radius:8px;padding:0 16px;font-weight:bold}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.chat-grid{grid-template-columns:1fr}}@media(max-width:500px){.stats{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="top"><h1>GOAL$GAMBIT Admin</h1><span><a href="admin-verifications.html">⚖ Result Reviews</a> &nbsp; <a href="chat.html">← Chat Center</a></span></div><div id="denied"></div><section id="adminArea" style="display:none"><div class="stats"><div class="stat">Users<strong id="total">0</strong></div><div class="stat">Active<strong id="active">0</strong></div><div class="stat">Suspended<strong id="suspended">0</strong></div><div class="stat">Open Complaints<strong id="open">0</strong></div></div><section class="panel"><h2>Manage Users</h2><div id="users">Loading...</div></section><section class="panel"><h2>Complaints</h2><div id="complaints">Loading...</div></section><section class="panel"><h2>Support Chats</h2><div class="chat-grid"><div id="threads" class="threads">Loading...</div><div><div id="messages" class="messages">Select a user support chat.</div><div class="send"><input id="reply" maxlength="2000" placeholder="Reply to selected user..."><button onclick="sendReply()">Send</button></div></div></div></section></section></main><script src="../js/api.js"></script><script>GG.requireLogin();let selectedUser=null,lastSig='';const $=id=>document.getElementById(id);function esc(v){return GG.escapeHTML(v)}async function guard(){let r=await GG.api('/api/me');if(!r.ok||!r.data.user||r.data.user.role!=='admin'){ $('denied').innerHTML='<div class="panel">Administrator access required.</div>';return false}$('adminArea').style.display='block';return true}async function loadOverview(){let r=await GG.api('/api/admin/overview');if(r.ok){$('total').textContent=r.data.users.total;$('active').textContent=r.data.users.active;$('suspended').textContent=r.data.users.suspended;$('open').textContent=r.data.complaints.open}}async function loadUsers(){let r=await GG.api('/api/admin/users');if(!r.ok)return;$('users').innerHTML=(r.data.users||[]).map(u=>`<div class="row"><div class="grow"><strong>${esc(u.username)}</strong><br><small>${esc(u.game)} · ${esc(u.account_status)}</small></div><button class="btn" onclick="status(${u.id},'active')">Activate</button><button class="btn" onclick="status(${u.id},'suspended')">Suspend</button><button class="btn red" onclick="status(${u.id},'closed')">Close</button></div>`).join('')||'No users.'}async function status(id,s){let reason=prompt('Reason for '+s+' account:')||'';let r=await GG.api('/api/admin/users/'+id+'/status',{method:'POST',body:{status:s,reason:reason}});if(!r.ok)alert(r.data.message||'Action failed');loadUsers();loadOverview()}async function loadComplaints(){let r=await GG.api('/api/admin/complaints');if(!r.ok)return;$('complaints').innerHTML=(r.data.complaints||[]).map(c=>`<div class="complaint"><strong>#${c.id} ${esc(c.subject)}</strong><div>${esc(c.description)}</div><small>From ${esc(c.reporter_username)} ${c.reported_username?'· About '+esc(c.reported_username):''} · ${esc(c.status)}</small><br><button class="btn gold" onclick="resolve(${c.id})">Resolve</button><button class="btn" onclick="dismiss(${c.id})">Dismiss</button></div>`).join('')||'No complaints.'}async function resolve(id){let note=prompt('Admin note:')||'';await GG.api('/api/admin/complaints/'+id,{method:'POST',body:{status:'resolved',note}});loadComplaints();loadOverview()}async function dismiss(id){await GG.api('/api/admin/complaints/'+id,{method:'POST',body:{status:'dismissed'}});loadComplaints();loadOverview()}async function loadThreads(){let r=await GG.api('/api/admin/support');if(!r.ok)return;$('threads').innerHTML=(r.data.threads||[]).map(t=>`<button class="btn ${selectedUser===Number(t.user_id)?'gold':''}" onclick="selectThread(${t.user_id})">${esc(t.username)} ${t.unread?'('+t.unread+' new)':''}</button>`).join('')||'No support chats.'}async function selectThread(id){selectedUser=id;lastSig='';await loadThread();loadThreads()}async function loadThread(){if(!selectedUser)return;let r=await GG.api('/api/admin/support/'+selectedUser);if(!r.ok)return;let ms=r.data.messages||[],sig=ms.map(m=>m.id+':'+m.message).join('|');if(sig===lastSig)return;lastSig=sig;$('messages').innerHTML=ms.length?ms.map(m=>`<div class="bubble ${Number(m.sender_id)===Number(localStorage.getItem('goalGambitUserId'))?'mine':''}">${esc(m.message)}<br><small>${esc(m.username)} · ${new Date(m.created_at).toLocaleString()}</small></div>`).join(''):'No messages.';$('messages').scrollTop=$('messages').scrollHeight}async function sendReply(){if(!selectedUser)return;let i=$('reply'),v=i.value.trim();if(!v)return;let r=await GG.api('/api/admin/support/'+selectedUser,{method:'POST',body:{message:v}});if(!r.ok){alert(r.data.message||'Could not send');return}i.value='';lastSig='';loadThread()}(async()=>{if(await guard()){loadOverview();loadUsers();loadComplaints();loadThreads();setInterval(()=>{loadOverview();loadUsers();loadComplaints();loadThreads();loadThread()},3000)}})();</script></body></html>
