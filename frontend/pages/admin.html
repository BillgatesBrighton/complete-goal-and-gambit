<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#090a0b">
  <title>GOAL$GAMBIT | Admin Access</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#090a0b;color:#f7f7f7;font:16px system-ui,"Segoe UI",sans-serif}
    #access{max-width:520px;margin:20px;padding:24px;border:1px solid #2b3033;border-radius:16px;background:#121416;text-align:center;color:#c6c9cb}
  </style>
</head>
<body>
  <main id="access" role="status" aria-live="polite">Checking administrator access…</main>
  <script src="../js/api.js?v=20261019-companion-onboarding"></script>
  <script>
    (function () {
      "use strict";
      var access = document.getElementById("access");
      if (!GG.requireLogin()) return;
      (async function () {
        try {
          var me = await GG.api("/api/me");
          if (!me.ok || !me.data.user) {
            access.textContent = "Please sign in to continue.";
            return;
          }
          if (me.data.user.role !== "admin") {
            location.replace("chat.html");
            return;
          }
          var response = await fetch(GG.API_BASE + "/api/admin/dashboard-page", {
            headers: { Authorization: "Bearer " + GG.getToken() },
            cache: "no-store"
          });
          if (response.status === 401 || response.status === 403) {
            location.replace("chat.html");
            return;
          }
          if (!response.ok) throw new Error("Could not load the administrator dashboard.");
          var html = await response.text();
          document.open();
          document.write(html);
          document.close();
        } catch (error) {
          access.textContent = error.message || "Could not verify administrator access.";
        }
      })();
    })();
  </script>
</body>
</html>
