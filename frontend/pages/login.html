    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GOAL$GAMBIT | Log In</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>


<header class="navbar">
    <link rel="manifest" href="../manifest.webmanifest">

    <a href="index.html" class="brand">

        <span class="brand-icon">
            ♛
        </span>

        <span>
            GOAL$GAMBIT
        </span>

    </a>


    <nav class="desktop-nav">

        <a href="index.html">
            Home
        </a>

        <a href="how-it-works.html">
            How It Works
        </a>

        <a href="leaderboard.html">
            Leaderboard
        </a>

    </nav>


    <div class="nav-actions">

        <a href="login.html" class="login-button">
            Log In
        </a>

        <a href="signup.html" class="signup-button">
            Create Account
        </a>

    </div>

</header>



<main>

    <section class="final-section">

        <span class="section-label">
            WELCOME BACK
        </span>


        <h2>

            Log in to

            <span>
                GOAL$GAMBIT.
            </span>

        </h2>


        <p>
            Continue to your player account.
        </p>



        <form
            id="loginForm"
            style="max-width:500px;margin:35px auto;text-align:left;"
        >


            <label for="username">
                Username
            </label>


            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter your username"
                required
                autocomplete="username"
                style="width:100%;padding:15px;margin:8px 0 20px;"
            >



            <label for="password">
                Password
            </label>


            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
                autocomplete="current-password"
                style="width:100%;padding:15px;margin:8px 0 20px;"
            >



            <button
                type="submit"
                class="primary-button large"
                style="border:0;cursor:pointer;width:100%;"
            >

                Log In

                <b>
                    →
                </b>

            </button>


        </form>

        <p style="max-width:500px;margin:-16px auto 20px;text-align:right;">
            <a id="openPasswordReset" class="text-link" href="password-recovery.html" style="color:inherit;text-decoration:underline;cursor:pointer;font:inherit;">
                Forgot or need to change your password?
            </a>
        </p>



        <p
            id="loginMessage"
            style="color:#f4bd20;"
        ></p>


        <p>

            Don't have an account?

            <a
                href="signup.html"
                class="text-link"
            >
                Create one
            </a>

        </p>


    </section>

</main>



<footer>

    <div class="footer-column">

        <h4>

        <a href="contact.html">

        <a href="terms.html">

        </a>


        <a href="privacy.html">
            Privacy
        </a>

    </div>

</footer>



<script src="../js/api.js?v=20261024-companion-latest-122"></script>
<script>
(function openDashboardOnlyForValidSession() {
    // Allow the support recovery form to be reached even from a browser that
    // still has a valid signed-in session.
    if (new URLSearchParams(location.search).get("recovery") === "1") return;
    if (!GG.getToken()) return;
    // A stale token must not redirect the user away from this page: doing so
    // hides the forgot-password flow and can trap them on the invalid-session
    // screen. Keep the page open unless the backend confirms the session.
    GG.api("/api/me", { noRedirect: true }).then(function(result) {
        if (result.ok && result.data && result.data.user) {
            location.replace(GG.takePostLoginDestination() || "dashboard.html");
            return;
        }
        if (result.status === 401 || result.status === 403) GG.clearSession();
    });
})();

document.getElementById("loginForm").addEventListener("submit", async function (event) {
    event.preventDefault();

    var message = document.getElementById("loginMessage");
    var button = event.target.querySelector("button[type=submit]");
    var username = document.getElementById("username").value.trim();
    var password = document.getElementById("password").value;

    message.textContent = "";
    button.disabled = true;

    var result = await GG.api("/api/auth/login", {
        method: "POST",
        body: { username: username, password: password },
        noRedirect: true
    });

    button.disabled = false;

    if (!result.ok) {
        message.textContent = result.data.message || "Login failed.";
        return;
    }

    // The game (Chess / eFootball / Both) is stored on the account, so the
    // right dashboard opens on any device.
    GG.saveSession(result.data.token, result.data.user, result.data.user.game);
    location.replace(GG.takePostLoginDestination() || "dashboard.html");
});

</script>



</body>

</html>
