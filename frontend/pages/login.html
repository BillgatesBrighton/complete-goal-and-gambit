<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="manifest" href="../manifest.webmanifest">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GOAL$GAMBIT | Log In</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>


<header class="navbar">
    <link rel="manifest" href="../manifest.webmanifest">

    <a href="index.html" class="brand">

        <span class="brand-icon">
            ♛
        </span>

        <span>
            GOAL$GAMBIT
        </span>

    </a>


    <nav class="desktop-nav">

        <a href="index.html">
            Home
        </a>

        <a href="how-it-works.html">
            How It Works
        </a>

        <a href="leaderboard.html">
            Leaderboard
        </a>

    </nav>


    <div class="nav-actions">

        <a href="login.html" class="login-button">
            Log In
        </a>

        <a href="signup.html" class="signup-button">
            Create Account
        </a>

    </div>

</header>



<main>

    <section class="final-section">

        <span class="section-label">
            WELCOME BACK
        </span>


        <h2>

            Log in to

            <span>
                GOAL$GAMBIT.
            </span>

        </h2>


        <p>
            Continue to your player account.
        </p>



        <form
            id="loginForm"
            style="max-width:500px;margin:35px auto;text-align:left;"
        >


            <label for="username">
                Username
            </label>


            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter your username"
                required
                autocomplete="username"
                style="width:100%;padding:15px;margin:8px 0 20px;"
            >



            <label for="password">
                Password
            </label>


            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
                autocomplete="current-password"
                style="width:100%;padding:15px;margin:8px 0 20px;"
            >



            <button
                type="submit"
                class="primary-button large"
                style="border:0;cursor:pointer;width:100%;"
            >

                Log In

                <b>
                    →
                </b>

            </button>


        </form>

        <p style="max-width:500px;margin:-16px auto 20px;text-align:right;">
            <button type="button" id="openPasswordReset" class="text-link" style="border:0;background:none;color:inherit;text-decoration:underline;cursor:pointer;font:inherit;">
                Forgot or need to change your password?
            </button>
        </p>

        <section id="passwordResetPanel" hidden style="max-width:500px;margin:0 auto 28px;padding:22px;text-align:left;border:1px solid #3a3525;border-radius:14px;background:#111;">
            <h3 style="margin-top:0;">Reset password by phone</h3>
            <p style="color:#aaa;font-size:14px;">We’ll send a one-time code to the phone number saved on your account.</p>
            <label for="resetUsername">Username</label>
            <input id="resetUsername" type="text" maxlength="30" autocomplete="username" style="width:100%;padding:13px;margin:8px 0 12px;">
            <button id="requestResetCode" type="button" class="primary-button" style="border:0;cursor:pointer;width:100%;">Send reset code</button>
            <form id="confirmPasswordReset" hidden style="margin-top:16px;">
                <label for="resetCode">6-digit code</label>
                <input id="resetCode" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" style="width:100%;padding:13px;margin:8px 0 12px;">
                <label for="resetNewPassword">New password</label>
                <input id="resetNewPassword" type="password" minlength="8" maxlength="128" autocomplete="new-password" style="width:100%;padding:13px;margin:8px 0 12px;">
                <label for="resetConfirmPassword">Confirm new password</label>
                <input id="resetConfirmPassword" type="password" minlength="8" maxlength="128" autocomplete="new-password" style="width:100%;padding:13px;margin:8px 0 12px;">
                <button id="confirmResetButton" type="submit" class="primary-button" style="border:0;cursor:pointer;width:100%;">Reset password</button>
            </form>
            <p id="resetMessage" role="status" aria-live="polite" style="color:#f4bd20;min-height:1.5em;margin-bottom:0;"></p>
        </section>



        <p
            id="loginMessage"
            style="color:#f4bd20;"
        ></p>


        <p>

            Don't have an account?

            <a
                href="signup.html"
                class="text-link"
            >
                Create one
            </a>

        </p>


    </section>

</main>



<footer>

    <div class="footer-column">

        <h4>
            Support
        </h4>


        <a href="contact.html">
            Contact
        </a>


        <a href="terms.html">
            Terms
        </a>


        <a href="privacy.html">
            Privacy
        </a>

    </div>

</footer>



<script src="../js/api.js"></script>
<script>
if (GG.getToken()) {
    location.replace("dashboard.html");
}

document.getElementById("loginForm").addEventListener("submit", async function (event) {
    event.preventDefault();

    var message = document.getElementById("loginMessage");
    var button = event.target.querySelector("button[type=submit]");
    var username = document.getElementById("username").value.trim();
    var password = document.getElementById("password").value;

    message.textContent = "";
    button.disabled = true;

    var result = await GG.api("/api/auth/login", {
        method: "POST",
        body: { username: username, password: password },
        noRedirect: true
    });

    button.disabled = false;

    if (!result.ok) {
        message.textContent = result.data.message || "Login failed.";
        return;
    }

    // The game (Chess / Konami / Both) is stored on the account, so the
    // right dashboard opens on any device.
    GG.saveSession(result.data.token, result.data.user, result.data.user.game);
    location.replace("dashboard.html");
});

var resetPanel=document.getElementById("passwordResetPanel");
document.getElementById("openPasswordReset").addEventListener("click",function(){
    resetPanel.hidden=!resetPanel.hidden;
    if(!resetPanel.hidden){document.getElementById("resetUsername").value=document.getElementById("username").value.trim();document.getElementById("resetUsername").focus();}
});
document.getElementById("requestResetCode").addEventListener("click",async function(){
    var button=this,username=document.getElementById("resetUsername").value.trim(),message=document.getElementById("resetMessage");
    if(!username){message.textContent="Enter your username first.";return;}
    button.disabled=true;message.textContent="Requesting a code…";
    var result=await GG.api("/api/auth/password-reset/request",{method:"POST",body:{username:username},noRedirect:true});
    button.disabled=false;
    message.textContent=result.data.message||(result.ok?"Check the phone saved on your account.":"Could not request a reset code.");
    if(result.ok)document.getElementById("confirmPasswordReset").hidden=false;
});
document.getElementById("confirmPasswordReset").addEventListener("submit",async function(event){
    event.preventDefault();
    var code=document.getElementById("resetCode").value.trim(),password=document.getElementById("resetNewPassword").value,confirmPassword=document.getElementById("resetConfirmPassword").value;
    var button=document.getElementById("confirmResetButton"),message=document.getElementById("resetMessage");
    if(password!==confirmPassword){message.textContent="The new passwords do not match.";return;}
    button.disabled=true;message.textContent="Resetting password…";
    var result=await GG.api("/api/auth/password-reset/confirm",{method:"POST",body:{username:document.getElementById("resetUsername").value.trim(),code:code,newPassword:password},noRedirect:true});
    button.disabled=false;
    message.textContent=result.data.message||(result.ok?"Password reset. Sign in with your new password.":"Could not reset your password.");
    if(result.ok){document.getElementById("password").value="";document.getElementById("resetCode").value="";document.getElementById("resetNewPassword").value="";document.getElementById("resetConfirmPassword").value="";}
});
</script>



</body>

</html>
